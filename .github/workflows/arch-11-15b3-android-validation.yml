name: ARCH-11.15B3 Android validation

on:
  push:
    branches:
      - arch/11.15b3-fcm-receive
    paths:
      - ".github/workflows/arch-11-15b3-android-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create temporary Firebase config
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "transfer-driver-ci",
              "storage_bucket": "transfer-driver-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                  "android_client_info": {
                    "package_name": "ru.transferservis.driver"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDUMMYKEYFORCIVALIDATIONONLY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - run: chmod +x ./gradlew

      - run: ./gradlew clean :app:testDebugUnitTest :app:assembleDebug
