name: Android branch tests

on:
  push:
    branches:
      - 'arch/**'
      - 'fix/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: android-branch-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run JVM contract and unit tests
        run: |
          ./gradlew testDebugUnitTest \
            -x processDebugGoogleServices \
            --no-daemon \
            --stacktrace
