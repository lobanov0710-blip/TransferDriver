name: Android branch tests

on:
  push:
    branches:
      - 'arch/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: android-branch-tests-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create synthetic Firebase config for CI
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "transfer-driver-ci",
              "storage_bucket": "transfer-driver-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                  "android_client_info": {
                    "package_name": "ru.transferservis.driver"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDUMMYKEYFORCIVALIDATIONONLY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Create independent Admin debug signing identity
        shell: bash
        run: |
          umask 077
          mkdir -p .local-signing
          keytool -genkeypair -keystore .local-signing/admin-debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Transfer Admin Debug'

      - name: Check Android security configuration
        run: |
          python3 tools/check_security.py
          python3 tools/check_admin_security.py

      - name: Verify Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Test and build debug, staging and release
        run: |
          ./gradlew clean \
            :app:testDebugUnitTest \
            :app:testStagingUnitTest \
            :app:testReleaseUnitTest \
            :app:assembleDebug \
            :app:assembleStaging \
            :app:assembleRelease \
            :app:bundleStaging \
            :app:assembleDebugAndroidTest \
            :app:lintDebug \
            :app:lintStaging \
            :app:lintRelease \
            :admin:testDebugUnitTest \
            :admin:testStagingUnitTest \
            :admin:testReleaseUnitTest \
            :admin:assembleDebug \
            :admin:assembleStaging \
            :admin:assembleRelease \
            :admin:bundleStaging \
            :admin:assembleDebugAndroidTest \
            :admin:lintDebug \
            :admin:lintStaging \
            :admin:lintRelease \
            --no-daemon \
            --stacktrace

      - name: Verify build-variant API endpoint locks
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_FILE="$(find app/build/generated -type f -path '*/debug/*' -name BuildConfig.java -print -quit)"
          STAGING_FILE="$(find app/build/generated -type f -path '*/staging/*' -name BuildConfig.java -print -quit)"
          RELEASE_FILE="$(find app/build/generated -type f -path '*/release/*' -name BuildConfig.java -print -quit)"

          test -n "$DEBUG_FILE"
          test -n "$STAGING_FILE"
          test -n "$RELEASE_FILE"

          grep -F 'https://uber-v3-staging.lobanov0710.workers.dev/' "$DEBUG_FILE"
          grep -F 'https://uber-v3-staging.lobanov0710.workers.dev/' "$STAGING_FILE"
          grep -F 'public static final boolean DEBUG = false;' "$STAGING_FILE"
          grep -F 'https://uber-v3.lobanov0710.workers.dev/' "$RELEASE_FILE"

          if grep -Fq 'https://uber-v3.lobanov0710.workers.dev/' "$DEBUG_FILE"; then
            echo 'DEBUG_ENDPOINT_IS_PRODUCTION=FAIL'
            exit 10
          fi

          if grep -Fq 'https://uber-v3-staging.lobanov0710.workers.dev/' "$RELEASE_FILE"; then
            echo 'RELEASE_ENDPOINT_IS_STAGING=FAIL'
            exit 11
          fi

          if grep -Fq 'https://uber-v3.lobanov0710.workers.dev/' "$STAGING_FILE"; then
            echo 'STAGING_ENDPOINT_IS_PRODUCTION=FAIL'
            exit 14
          fi

          echo 'DEBUG_ENDPOINT=STAGING'
          echo 'RELEASE_ENDPOINT=PRODUCTION'
          echo 'STAGING_ENDPOINT=STAGING'
          echo 'STAGING_DEBUGGABLE=false'
          echo 'API_ENDPOINT_VARIANT_LOCK=PASS'

      - name: Verify isolated Admin package and signing identity
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, os, re, subprocess
          certificates = []
          for module, package in [('app','ru.transferservis.driver'), ('admin','ru.transferservis.admin')]:
              metadata = json.loads(Path(module+'/build/outputs/apk/debug/output-metadata.json').read_text())
              assert metadata['applicationId'] == package
              apk = Path(module+'/build/outputs/apk/debug') / metadata['elements'][0]['outputFile']
              output = subprocess.check_output([os.environ['ANDROID_HOME']+'/build-tools/37.0.0/apksigner', 'verify', '--print-certs', str(apk)], text=True)
              found = set(re.findall(r'certificate SHA-256 digest: ([0-9a-f]{64})', output))
              assert len(found) == 1, 'Expected exactly one verified debug certificate'
              certificates.append(found.pop())
          assert certificates[0] != certificates[1], 'Admin and Driver signing keys must be different'
          print('ADMIN_PACKAGE_AND_SIGNING_ISOLATION=PASS')
          PYCODE

      - name: Verify App Check provider policy
        shell: bash
        run: |
          set -euo pipefail

          grep -F 'firebase-appcheck-playintegrity' app/build.gradle.kts

          if grep -Fq 'firebase-appcheck-debug' app/build.gradle.kts; then
            echo 'APP_CHECK_DEBUG_PROVIDER=FORBIDDEN'
            exit 12
          fi

          echo 'APP_CHECK_PROVIDER=PLAY_INTEGRITY'
          echo 'APP_CHECK_DEBUG_PROVIDER=ABSENT'

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android security instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --no-daemon --stacktrace
            mkdir -p registration-evidence
            for image in profile-light profile-dark-large vehicle-light vehicle-dark-large availability-offline-light availability-online-light availability-offline-dark-large availability-online-dark-large; do adb exec-out run-as ru.transferservis.driver cat files/registration-evidence/$image.png > registration-evidence/$image.png; done
            python3 tools/check_registration_evidence.py registration-evidence
            touch registration-evidence/.driver-validated
            ./gradlew :app:installDebug --no-daemon --stacktrace
            ./gradlew :admin:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --no-daemon --stacktrace
            for image in assignment-orders-light assignment-options-light assignment-form-light assignment-confirm-light assignment-uncertain-light assignment-orders-dark-large assignment-options-dark-large assignment-form-dark-large assignment-confirm-dark-large assignment-uncertain-dark-large; do adb exec-out run-as ru.transferservis.admin cat files/assignment-evidence/$image.png > registration-evidence/$image.png; done
            python3 tools/check_assignment_evidence.py registration-evidence
            for image in photo-vehicles-light photo-checks-light photo-form-light photo-confirm-light photo-uncertain-light photo-vehicles-dark-large photo-checks-dark-large photo-form-dark-large photo-confirm-dark-large photo-uncertain-dark-large; do adb exec-out run-as ru.transferservis.admin cat files/photo-evidence/$image.png > registration-evidence/$image.png; done
            python3 tools/check_photo_control_evidence.py registration-evidence
            touch registration-evidence/.validated

      - name: Verify executed JVM and Android test reports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name, directory in [
              ('JVM', 'app/build/test-results/testDebugUnitTest'),
              ('STAGING_JVM', 'app/build/test-results/testStagingUnitTest'),
              ('RELEASE_JVM', 'app/build/test-results/testReleaseUnitTest'),
              ('ANDROID', 'app/build/outputs/androidTest-results/connected'),
              ('ADMIN_DEBUG_JVM', 'admin/build/test-results/testDebugUnitTest'),
              ('ADMIN_STAGING_JVM', 'admin/build/test-results/testStagingUnitTest'),
              ('ADMIN_RELEASE_JVM', 'admin/build/test-results/testReleaseUnitTest'),
              ('ADMIN_ANDROID', 'admin/build/outputs/androidTest-results/connected'),
          ]:
              files = list(Path(directory).rglob('TEST-*.xml'))
              cases = [case for file in files for case in ET.parse(file).iter('testcase')]
              assert cases, name + ': no executed tests'
              for case in cases:
                  assert all(case.find(tag) is None for tag in ('failure', 'error', 'skipped')), case.attrib
              if name == 'ANDROID':
                  for required in (
                      'delayedHttpUnauthorizedPreservesTheSubsequentLogin',
                      'sessionFromAnotherBackendRequiresLogin',
                      'legacySessionWithoutBackendBindingRequiresLogin',
                      'profileAndVehicleMutationsHaveNoAutomatic401RefreshOrReplay',
                      'ambiguousVehicleCreateIsSentExactlyOnce',
                      'changedAccountStopsQueuedMutationBeforeNetwork',
                      'sameAccountReloginCannotReuseOldFormSession',
                      'delayedResponseCannotExposePreviousAccountData',
                      'cancelledQueuedMutationCannotRunAfterRebind',
                      'uiSavesRevisionAndConfirmedPhoneCannotBeEdited',
                      'vehicleUiRequiresVinAndSavesSeparateVehicleRevision',
                      'ambiguousUiMutationRequiresReloadBeforeAnotherSave',
                      'backgroundClearsUnsavedInputAndSecureCaptureFlagRemains',
                      'nativeSyntheticScreensLight',
                      'nativeSyntheticScreensDarkLargeFont',
                      'requiresAuthoritativeProfileIdentityVehicleAndRevision',
                      'onlineWaitsForServerAndOfflineKeepsVehicleWithIndependentRevision',
                      'lostAcknowledgementIsNotRetriedAndReloadResolvesServerState',
                      'delayedUnauthorizedPreservesNextLoginAndNeverReplaysAvailability',
                      'backgroundClearsVehicleAndInvalidatesPendingOperation',
                      'realSliderGestureUsesChosenVehicleAndOnlineHidesSwitch',
                      'nativeAvailabilityLight',
                      'nativeAvailabilityDarkLargeFont',
                  ):
                      assert any(required in case.get('name', '') for case in cases), required + ': not executed'
              if name == 'ADMIN_ANDROID':
                  for required in (
                      'driverAndForeignBackendCiphertextRequireNewLogin',
                      'ownerProfileDoesNotOpenOperationalQueueWithoutMfa',
                      'staleRefreshCannotBecomeAnotherAdminRequest',
                      'installedAdminAndDriverHaveDifferentUids',
                      'dispatcherReadsQueueWithRotatedSessionAndLogoutRevokesIt',
                      'revokedDispatcherPermissionStopsQueueBeforeTransport',
                      'wrongLegacyRoleIsNotStoredAndIssuedSessionIsRevoked',
                      'delayedUnauthorizedDoesNotRetryAsNewAdmin',
                      'passwordChallengeNeverPersistsSessionAndClearsPreviousAccount',
                      'verifiedOwnerSessionIsStoredOnlyAfterAuthoritativeMfaProfile',
                      'missingMfaProfileAfterVerifyCannotCreateOwnerSession',
                      'cancelledMfaCannotRestoreSessionOrReadOwnerProfile',
                      'enrollmentSeedAndRecoveryCodesNeverEnterPersistentStorage',
                      'enrollmentBackgroundKeepsOnlyOpaqueIdsAndNeverSeed',
                      'recoveryCodesAreNotSavedOrRetainedWhenScreenLeavesForeground',
                      'samePhoneSwitchPreservesChallengeWithoutCodesOrExtendedExpiry',
                      'retainedChallengeExpiresWithoutAnotherNetworkRequest',
                      'partialReviewUsesFreshPermissionsAndPreservesOtherVerifiedItems',
                      'lostAcknowledgementRequiresExplicitRetryWithSameBodyAndKey',
                      'revokedGrantStopsPendingMutationBeforePostAndSensitiveReadBeforeTransport',
                      'delayedMutationUnauthorizedDoesNotRefreshOrUseAnotherAccount',
                      'resourceIsBoundToSnapshotAndNeverStoredInPreferences',
                      'uncertainCommandIsNeverReplayedUntilExplicitSameKeyRetry',
                      'revokedGrantOrOwnerMfaStopsMutationBeforePost',
                      'cancelledQueuedActionCannotRunAfterSameSessionRebind',
                      'delayedReadCannotExposeOldAccountOrEraseItsNextLogin',
                      'command401And503HaveNoAutomaticRefreshOrReplay',
                      'explicitConfirmationRequiresReasonAndUsesCurrentOrderRevision',
                      'identicalRoutesRemainDistinguishableBeforeSelectionAndConfirmation',
                      'uncertainUiOnlyRetriesOriginalBodyAndKeyAfterExplicitConfirmation',
                      'realLifecycleClearsReasonSnapshotsAndCancelsPendingOperation',
                      'reassignChoosesAnotherVehicleAndUsesOrderRevision',
                      'sameAccountReloginInvalidatesVisibleConfirmationWithoutErasingNextSession',
                      'photoUncertainCommandIsNeverReplayedUntilExplicitSameKeyRetry',
                      'photoRevokedGrantOrOwnerMfaStopsMutationBeforePost',
                      'photoCancelledQueuedActionCannotRunAfterSameSessionRebind',
                      'photoDelayedReadCannotExposeOldAccountOrEraseItsNextLogin',
                      'photoCommand401And503HaveNoAutomaticRefreshOrReplay',
                      'photoRevisionChangeInvalidatesSelectionAndOwnerPhoneScopeHasNoOperationalRead',
                      'photoExplicitKindModeReasonConfirmationAndVehicleRevision',
                      'photoUncertainRetryKeepsOriginalBodyAndKeyAfterRead',
                      'photoConflictClosesSelectionAndRevokedGrantNeverPosts',
                      'photoPagingDoesNotAutoSelectAndReadOnlyGrantCannotCreate',
                      'photoSameAccountReloginInvalidatesConfirmationAndPreservesNextSession',
                      'photoBackgroundClearsReasonSnapshotsAndSavedViewState',
                      'nativePhotoControlLight',
                      'nativePhotoControlDarkLargeFont',
                      'nativeAssignmentLight',
                      'nativeAssignmentDarkLargeFont',
                      'moderationUiExplicitlyRetriesUncertainStartAndReturnsOneElementWithReason',
                      'reviewMaterialReasonAndProfileAreNotSavedAndBackgroundClearsThem',
                  ):
                      assert any(required in case.get('name', '') for case in cases), required + ': not executed'
              print(name + '_TESTS=PASS count=' + str(len(cases)))
          PY

      - name: Upload synthetic native form evidence
        if: ${{ !cancelled() && hashFiles('registration-evidence/.validated') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registration-synthetic-native-evidence
          path: registration-evidence/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload tested Admin debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-photo-control-debug-apk
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Print instrumentation report on failure
        if: failure()
        shell: bash
        run: |
          for report_dir in app/build/outputs/androidTest-results/connected admin/build/outputs/androidTest-results/connected; do
            if [[ -d "$report_dir" ]]; then
              find "$report_dir" -type f -name '*.xml' -print -exec sed -n '1,260p' {} \;
            fi
          done
